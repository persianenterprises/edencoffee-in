name: Rename eden-coffee-new.html to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git mv eden-coffee-new.html index.html
          git config user.name "persianenterprises"
          git config user.email "persianenterprises26@gmail.com"
          git commit -m "Rename eden-coffee-new.html to index.html"
          git push
